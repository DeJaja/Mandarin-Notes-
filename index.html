<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉语笔记本 · Mandarin Notebook</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;500&family=Outfit:wght@300;400;500;600&family=DM+Mono:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0B0E14; --surface: #10141C; --card: #161B26; --card2: #1C2233;
  --border:  rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --red:     #C93A2B; --red-dim: rgba(201,58,43,0.15);
  --gold:    #C4933A; --green: #2D9E6B; --blue: #2D7DD2; --purple: #7B5EA7;
  --text:    #E8E2D9; --muted: #8A9BB0; --faint: #4A5568;
  --sans:    'Outfit', system-ui, sans-serif;
  --serif:   'Lora', Georgia, serif;
  --zh:      'Noto Serif SC', 'Songti SC', serif;
  --mono:    'DM Mono', monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
}
html { font-size: 16px; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; line-height: 1.7; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 3px; }
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
@keyframes spin   { to { transform: rotate(360deg); } }
.fu  { animation: fadeUp .3s ease both; }
.fu1 { animation: fadeUp .3s .07s ease both; }
.fu2 { animation: fadeUp .3s .14s ease both; }
input, select, button { font-family: var(--sans); outline: none; }

.inp { width:100%; background:var(--card); border:1px solid var(--border2); border-radius:var(--r-md); padding:10px 13px; color:var(--text); font-size:.88rem; transition:border-color .2s; }
.inp:focus { border-color: var(--red); }
.inp::placeholder { color: var(--faint); }

.sel { background:var(--card); border:1px solid var(--border); border-radius:var(--r-sm); padding:8px 10px; color:var(--text); font-size:.8rem; cursor:pointer; transition:border-color .2s; }
.sel:focus { border-color: var(--red); }

.btn { display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--border2); border-radius:var(--r-sm); padding:7px 16px; color:var(--muted); font-size:.82rem; cursor:pointer; transition:background .15s, color .15s; white-space:nowrap; }
.btn:hover { background:var(--card2); color:var(--text); }
.btn.primary { background:var(--red); border-color:var(--red); color:#fff; }
.btn.primary:hover { background:#a82e21; }
.btn.danger  { color:#f08080; border-color:rgba(201,58,43,.3); }
.btn.danger:hover { background:rgba(201,58,43,.1); }

.badge { display:inline-block; padding:2px 9px; border-radius:4px; font-size:.7rem; font-weight:500; white-space:nowrap; }

.topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:0 1.75rem; display:flex; align-items:center; justify-content:space-between; height:58px; gap:12px; flex-shrink:0; position:sticky; top:0; z-index:100; }
.brand { display:flex; align-items:center; gap:12px; }
.brand-zh { font-family:var(--zh); font-size:28px; color:var(--red); line-height:1; }
.brand-name { font-family:var(--serif); font-size:.95rem; font-weight:500; }
.brand-count { font-size:.7rem; color:var(--faint); margin-top:1px; }
.nav { display:flex; align-items:center; gap:3px; }
.nav-btn { background:transparent; border:none; padding:7px 15px; color:var(--muted); font-size:.82rem; font-family:var(--sans); cursor:pointer; border-radius:var(--r-sm); transition:color .15s, background .15s; position:relative; }
.nav-btn:hover { color:var(--text); background:var(--card2); }
.nav-btn.active { color:var(--text); background:var(--red-dim); }
.nav-btn.active::after { content:''; position:absolute; bottom:-1px; left:20%; right:20%; height:2px; background:var(--red); border-radius:2px 2px 0 0; }

.main { padding:1.75rem; max-width:1400px; margin:0 auto; }

.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:10px; margin-bottom:1.5rem; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:var(--r-md); padding:14px 16px; transition:border-color .2s; }
.stat-card:hover { border-color:var(--border2); }
.stat-num { font-family:var(--serif); font-size:1.6rem; font-weight:500; line-height:1; margin-bottom:5px; }
.stat-lbl { font-size:.67rem; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; }

.filter-bar { display:flex; gap:8px; margin-bottom:1rem; flex-wrap:wrap; align-items:center; }
.search-wrap { flex:1; min-width:200px; position:relative; }
.search-icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:13px; pointer-events:none; }
.search-inp { width:100%; background:var(--card); border:1px solid var(--border2); border-radius:var(--r-md); padding:9px 13px 9px 34px; color:var(--text); font-size:.85rem; font-family:var(--sans); transition:border-color .2s; }
.search-inp:focus { border-color:var(--red); outline:none; }
.search-inp::placeholder { color:var(--faint); }

.tbl-wrap { border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; overflow-x:auto; }
table { width:100%; border-collapse:collapse; min-width:680px; }
thead tr { background:var(--surface); }
thead th { text-align:left; padding:12px 16px; font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); border-bottom:1px solid var(--border); white-space:nowrap; font-weight:500; }
tbody tr { border-bottom:1px solid var(--border); transition:background .12s; }
tbody tr:last-child { border-bottom:none; }
tbody tr:hover { background:var(--card); }
tbody tr.expandable { cursor:pointer; }
tbody tr.ex-row { background:var(--surface) !important; cursor:default; }
td { padding:13px 16px; font-size:.92rem; vertical-align:middle; }
.c-zh  { font-family:var(--zh); font-size:1.35rem; white-space:nowrap; }
.c-pin { font-family:var(--mono); font-style:italic; color:var(--gold); font-size:.85rem; white-space:nowrap; }
.c-num { color:var(--faint); font-size:.8rem; }
.c-eng { color:#ccc5bb; max-width:240px; font-size:.92rem; }

.lessons-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; }
.lessons-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:12px; }
.lcard { background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); padding:1.25rem; position:relative; overflow:hidden; transition:border-color .2s, transform .18s; display:flex; flex-direction:column; }
.lcard:hover { border-color:var(--border2); transform:translateY(-1px); }
.lcard-accent { position:absolute; top:0; left:0; right:0; height:3px; border-radius:var(--r-lg) var(--r-lg) 0 0; }
.lcard-title { font-family:var(--serif); font-size:.95rem; font-weight:500; margin-top:8px; margin-bottom:3px; }
.lcard-meta  { font-size:.72rem; color:var(--faint); margin-bottom:11px; }
.lcard-acts  { display:flex; gap:7px; margin-top:auto; padding-top:12px; }

.upload-wrap { max-width:580px; }
.upload-zone { border:1.5px dashed var(--border2); border-radius:var(--r-lg); padding:3rem 2rem; text-align:center; cursor:pointer; background:var(--card); transition:border-color .2s, background .2s; }
.upload-zone:hover { border-color:rgba(201,58,43,.45); background:var(--card2); }
.upload-zone.busy  { cursor:not-allowed; border-color:var(--red); }
.status-box { margin-top:1rem; background:var(--card); border:1px solid var(--border); border-radius:var(--r-md); padding:1rem 1.25rem; }
.status-msg     { font-size:.85rem; color:var(--muted); }
.status-msg.ok  { color:var(--green); }
.status-msg.err { color:#ff8080; }
.prog-bar  { height:4px; background:var(--border); border-radius:2px; overflow:hidden; margin-top:11px; }
.prog-fill { height:100%; background:var(--red); border-radius:2px; transition:width .4s ease; }
.apikey-box { margin-top:1.25rem; background:var(--card); border:1px solid var(--border); border-radius:var(--r-md); padding:1rem 1.25rem; }
.apikey-lbl  { font-size:.72rem; color:var(--faint); text-transform:uppercase; letter-spacing:.07em; display:block; margin-bottom:7px; }
.apikey-note { font-size:.75rem; color:var(--faint); margin-top:8px; line-height:1.65; }
.apikey-note a { color:var(--blue); text-decoration:none; }
.apikey-note a:hover { text-decoration:underline; }
.upload-types { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:1.25rem; }
.utype-card { background:var(--card); border:1px solid var(--border); border-radius:var(--r-md); padding:12px 14px; }

.empty { text-align:center; padding:4rem 2rem; background:var(--card); border-radius:var(--r-lg); border:1px solid var(--border); }
.empty-zh  { font-family:var(--zh); font-size:52px; color:var(--red); opacity:.2; margin-bottom:1rem; }
.empty-ttl { font-family:var(--serif); font-size:1.05rem; color:var(--muted); margin-bottom:7px; }
.empty-sub { font-size:.82rem; color:var(--faint); margin-bottom:1.5rem; }
.res-info { font-size:.74rem; color:var(--faint); margin-bottom:8px; }

.mst-bar { display:flex; gap:3px; align-items:center; }
.mst-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.mst-label { font-size:.65rem; color:var(--faint); white-space:nowrap; }

.ai-ex-btn { background:transparent; border:1px dashed var(--border2); border-radius:var(--r-sm); padding:4px 10px; color:var(--faint); font-size:.75rem; cursor:pointer; transition:all .15s; display:inline-flex; align-items:center; gap:5px; }
.ai-ex-btn:hover { color:var(--gold); border-color:var(--gold); }
.ai-ex-loading { font-size:.8rem; color:var(--faint); font-style:italic; animation:pulse .9s infinite; }
.ai-ex-result { font-size:.85rem; color:var(--muted); font-style:italic; border-top:1px solid var(--border); padding-top:.65rem; margin-top:.65rem; line-height:1.6; }

.focus-toggle { display:inline-flex; align-items:center; gap:8px; background:var(--card2); border:1.5px solid var(--border2); border-radius:99px; padding:7px 16px; cursor:pointer; font-size:.85rem; color:var(--muted); transition:all .15s; user-select:none; }
.focus-toggle.on { border-color:var(--gold); color:var(--gold); background:rgba(196,147,58,.12); }
.focus-toggle-dot { width:10px; height:10px; border-radius:50%; background:var(--faint); transition:background .15s; }
.focus-toggle.on .focus-toggle-dot { background:var(--gold); }

.spinner { width:20px; height:20px; border:2px solid rgba(255,255,255,.15); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }

@keyframes popIn  { from{opacity:0;transform:scale(.93)} to{opacity:1;transform:scale(1)} }
@keyframes shake  { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 60%{transform:translateX(10px)} }
@keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:.45} }

.prac-setup { max-width:720px; margin:0 auto; }
.prac-modes { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:1.5rem; }
.prac-mode-card { background:var(--card); border:2px solid var(--border); border-radius:var(--r-lg); padding:1.5rem 1.25rem; text-align:center; cursor:pointer; transition:border-color .18s, transform .18s, background .18s; }
.prac-mode-card:hover { border-color:var(--border2); transform:translateY(-2px); background:var(--card2); }
.prac-mode-card.selected { border-color:var(--red); background:var(--red-dim); }
.prac-mode-icon  { font-size:2rem; margin-bottom:.6rem; line-height:1; }
.prac-mode-title { font-family:var(--serif); font-size:1rem; font-weight:500; margin-bottom:5px; }
.prac-mode-desc  { font-size:.78rem; color:var(--muted); line-height:1.5; }

.count-chips { display:flex; gap:8px; flex-wrap:wrap; }
.count-chip { background:var(--card2); border:1.5px solid var(--border2); border-radius:99px; padding:6px 18px; font-size:.85rem; color:var(--muted); cursor:pointer; transition:all .15s; }
.count-chip:hover { color:var(--text); border-color:var(--border2); }
.count-chip.selected { background:var(--red); border-color:var(--red); color:#fff; font-weight:500; }

.prac-opts { background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); padding:1.5rem; margin-bottom:1.25rem; }
.prac-opts-title { font-size:.75rem; color:var(--faint); text-transform:uppercase; letter-spacing:.09em; margin-bottom:1.1rem; font-weight:500; }
.prac-opts-row   { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:.9rem; }
.prac-opts-row:last-child { margin-bottom:0; }
.prac-lbl { font-size:.85rem; color:var(--muted); min-width:80px; font-weight:500; }

.prac-prog-wrap { background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); padding:1rem 1.5rem; margin-bottom:1.25rem; display:flex; align-items:center; gap:16px; }
.prac-prog-bar  { flex:1; height:7px; background:var(--border2); border-radius:4px; overflow:hidden; }
.prac-prog-fill { height:100%; background:var(--red); border-radius:4px; transition:width .35s ease; }
.prac-prog-txt  { font-size:.82rem; color:var(--muted); white-space:nowrap; }

@keyframes cardReveal { from{opacity:0;transform:translateY(10px) scale(.98)} to{opacity:1;transform:none} }
@keyframes cardFlip   { 0%{opacity:0;transform:rotateY(-12deg) scale(.97)} 100%{opacity:1;transform:none} }

.fc-card { background:var(--card); border:2px solid var(--border2); border-radius:var(--r-lg); min-height:280px; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2.5rem 2rem; text-align:center; cursor:pointer; margin-bottom:1.25rem; animation:cardReveal .2s ease both; position:relative; transition:border-color .2s; }
.fc-card:hover { border-color:rgba(255,255,255,.22); }
.fc-card.revealed { animation:cardFlip .25s ease both; border-color:rgba(196,147,58,.35); }
.fc-face-label { position:absolute; top:1.1rem; left:50%; transform:translateX(-50%); font-size:.7rem; color:var(--faint); text-transform:uppercase; letter-spacing:.1em; white-space:nowrap; }
.fc-badge-row { margin-bottom:1rem; }
.fc-zh-lg { font-family:var(--zh); font-size:clamp(1.6rem,5vw,3.8rem); line-height:1.25; color:var(--text); margin-bottom:.5rem; word-break:break-all; }
.fc-zh-sm { font-family:var(--zh); font-size:clamp(1.1rem,3vw,1.6rem); line-height:1.5; color:var(--text); margin-bottom:.5rem; }
.fc-pin-row { font-family:var(--mono); font-style:italic; color:var(--gold); font-size:1.1rem; margin-bottom:.85rem; }
.fc-eng-row { font-size:1.05rem; color:#ccc5bb; line-height:1.65; max-width:480px; }
.fc-eng-lg  { font-size:1.2rem; color:var(--text); line-height:1.65; max-width:460px; }
.fc-ex-row  { font-size:.88rem; color:var(--muted); font-style:italic; margin-top:1rem; padding-top:1rem; border-top:1px solid var(--border); max-width:460px; line-height:1.65; }
.fc-tap-hint { font-size:.78rem; color:var(--faint); margin-top:1rem; animation:pulse 2.2s ease infinite; }

.fc-actions { display:flex; gap:12px; justify-content:center; margin-bottom:1.25rem; }
.fc-btn { flex:1; max-width:230px; padding:15px 20px; border:none; border-radius:var(--r-md); font-size:.95rem; font-family:var(--sans); font-weight:500; cursor:pointer; transition:transform .15s; }
.fc-btn:hover { transform:translateY(-2px); }
.fc-btn:active { transform:scale(.97); }
.fc-btn.know   { background:#1a4a30; color:#4dd892; border:1px solid rgba(45,158,107,.3); }
.fc-btn.know:hover   { background:#1f5438; }
.fc-btn.unsure { background:#3a1a18; color:#f08080; border:1px solid rgba(201,58,43,.3); }
.fc-btn.unsure:hover { background:#481f1c; }
.fc-btn-nav { background:transparent; border:1px solid var(--border); color:var(--faint); border-radius:var(--r-sm); padding:8px 20px; font-size:.83rem; font-family:var(--sans); cursor:pointer; transition:color .15s, border-color .15s; }
.fc-btn-nav:hover { color:var(--muted); border-color:var(--border2); }

.qz-wrap  { max-width:620px; margin:0 auto; animation:popIn .3s ease; }
.qz-q-card { background:var(--card); border:1px solid var(--border2); border-radius:var(--r-lg); padding:2.75rem 2rem; text-align:center; margin-bottom:1.25rem; }
.qz-q-label { font-size:.75rem; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; margin-bottom:1.25rem; }
.qz-q-zh  { font-family:var(--zh); font-size:3.5rem; color:var(--text); line-height:1.25; margin-bottom:.5rem; }
.qz-q-pin { font-family:var(--mono); font-style:italic; color:var(--gold); font-size:1.05rem; }
.qz-q-eng { font-size:1.2rem; color:var(--text); font-weight:500; }
.qz-opts  { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:1.25rem; }
.qz-opt { background:var(--card); border:2px solid var(--border); border-radius:var(--r-md); padding:16px 18px; text-align:left; font-size:.92rem; color:var(--text); font-family:var(--sans); cursor:pointer; line-height:1.5; transition:border-color .15s, background .15s; }
.qz-opt:hover:not(:disabled) { border-color:var(--border2); background:var(--card2); }
.qz-opt:disabled { cursor:default; }
.qz-opt.correct { background:#122a1e; border-color:#2d9e6b; color:#4dd892; animation:popIn .25s ease; }
.qz-opt.wrong   { background:#2a1212; border-color:#c93a2b; color:#f08080; animation:shake .35s ease; }
.qz-opt.reveal  { background:#122a1e; border-color:#2d9e6b55; color:#4dd892; }
.qz-feedback    { text-align:center; font-size:.92rem; margin-bottom:.85rem; min-height:24px; }
.qz-feedback.ok  { color:#4dd892; }
.qz-feedback.bad { color:#f08080; }
.qz-next { display:block; width:100%; padding:14px; background:var(--red); border:none; border-radius:var(--r-md); color:#fff; font-size:.95rem; font-family:var(--sans); font-weight:500; cursor:pointer; transition:background .15s; }
.qz-next:hover { background:#a82e21; }

.type-card { background:var(--card); border:1px solid var(--border2); border-radius:var(--r-lg); padding:2.5rem 2rem; text-align:center; margin-bottom:1.25rem; }
.type-inp { width:100%; background:var(--card2); border:2px solid var(--border2); border-radius:var(--r-md); padding:14px 18px; color:var(--text); font-size:1.05rem; font-family:var(--sans); text-align:center; transition:border-color .2s; margin-top:1.5rem; outline:none; }
.type-inp:focus { border-color:var(--red); }
.type-inp.correct-border { border-color:#2d9e6b; }
.type-inp.wrong-border   { border-color:#c93a2b; }
.type-submit { display:block; width:100%; margin-top:10px; padding:13px; background:var(--card2); border:1px solid var(--border2); border-radius:var(--r-md); color:var(--muted); font-size:.95rem; font-family:var(--sans); font-weight:500; cursor:pointer; transition:background .15s, color .15s; }
.type-submit:hover { background:var(--red); border-color:var(--red); color:#fff; }
.type-reveal { font-size:.82rem; color:var(--faint); text-align:center; margin-top:.6rem; cursor:pointer; text-decoration:underline; }
.type-reveal:hover { color:var(--muted); }

.prac-results { max-width:520px; margin:0 auto; text-align:center; animation:popIn .35s ease; }
.prac-score-circle { width:140px; height:140px; border-radius:50%; margin:0 auto 1.5rem; display:flex; flex-direction:column; align-items:center; justify-content:center; border:3px solid; }
.prac-score-num { font-family:var(--serif); font-size:2.5rem; font-weight:500; line-height:1; }
.prac-score-lbl { font-size:.75rem; text-transform:uppercase; letter-spacing:.07em; margin-top:4px; }
.prac-res-grid  { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:1.25rem 0; }
.prac-res-card  { background:var(--card); border:1px solid var(--border); border-radius:var(--r-md); padding:1.1rem; }
.prac-res-num   { font-family:var(--serif); font-size:1.6rem; font-weight:500; }
.prac-res-lbl   { font-size:.75rem; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; }

.hsk-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:1.25rem; }
.hsk-level-tabs { display:flex; gap:6px; flex-wrap:wrap; }
.hsk-lvl { background:var(--card); border:1.5px solid var(--border); border-radius:99px; padding:6px 18px; font-size:.82rem; color:var(--muted); cursor:pointer; transition:all .15s; font-family:var(--sans); }
.hsk-lvl:hover  { border-color:var(--border2); color:var(--text); }
.hsk-lvl.active { background:var(--red); border-color:var(--red); color:#fff; font-weight:500; }
.hsk-prog { background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); padding:1rem 1.25rem; margin-bottom:1.25rem; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.hsk-prog-bar { flex:1; min-width:120px; height:8px; background:var(--border2); border-radius:4px; overflow:hidden; }

function masteryKey(v){ return (v.chinese||'')+'|'+(v.pinyin||''); }
function getMasteryMap(){ try{ return JSON.parse(ls.get('mastery')||'{}'); }catch(e){ return {}; } }
function saveMasteryMap(m){ ls.set('mastery', JSON.stringify(m)); }
function getMastery(v){ return (getMasteryMap()[masteryKey(v)]||0); }
function updateMastery(v, knew){ const m=getMasteryMap(); const k=masteryKey(v); const cur=m[k]||0; m[k]=Math.max(0,Math.min(5,cur+(knew?1:-1))); saveMasteryMap(m); }
function masteryLabel(score){ if(score<=0)return{label:'New',color:'#4A5568',dots:0}; if(score<=1)return{label:'Seen',color:'#c93a2b',dots:1}; if(score<=2)return{label:'Learning',color:'#c4933a',dots:2}; if(score<=3)return{label:'Getting there',color:'#c4933a',dots:3}; if(score<=4)return{label:'Almost',color:'#2d9e6b',dots:4}; return{label:'Mastered',color:'#2d9e6b',dots:5}; }
function renderMasteryBar(score, showLabel){ const info=masteryLabel(score); let h=`<div class="mst-bar">`; for(let i=0;i<5;i++){ const filled=i<info.dots; h+=`<div class="mst-dot" style="background:${filled?info.color:'var(--border2)'}"></div>`; } if(showLabel)h+=`<span class="mst-label" style="color:${info.color}">${info.label}</span>`; h+=`</div>`; return h; }

  set : (k,v)=> { try{ localStorage.setItem(currentUser.id+'_'+k, v); }catch(e){} },

  keys: p    => { const o=[],pre=currentUser.id+'_'+p; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(pre)) o.push(k.slice(currentUser.id.length+1)); } }catch(e){} return o; }

function loadLessons(){
  const keys=ls.keys('lesson:');
  const ver=ls.get('mn-ver');
  const isJames=currentUser.id==='james';
  const targetVer=isJames?'13':'4';
  if(isJames&&(!keys.length||ver!==targetVer)){
    SAMPLE.forEach(s=>ls.set(s.id,JSON.stringify(s)));
    ls.set('mn-ver',targetVer);
    lessons=SAMPLE.map(s=>({...s}));
  } else if(!isJames&&(!keys.length||ver!==targetVer)){
    GF_SAMPLE.forEach(s=>ls.set(s.id,JSON.stringify(s)));
    ls.set('mn-ver',targetVer);
    lessons=GF_SAMPLE.map(s=>({...s}));
  } else {
    lessons=[];
    keys.forEach(k=>{try{lessons.push(JSON.parse(ls.get(k)));}catch(e){}});
  }
  // Ensure the DiDi lesson is always present for James (upsert)
  if(isJames){
    const hasIt=lessons.some(l=>l.id===DIDI_YINXIANG.id);
    if(!hasIt){
      ls.set(DIDI_YINXIANG.id, JSON.stringify(DIDI_YINXIANG));
      lessons.push({...DIDI_YINXIANG});
    }
  }
  lessons.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const tot=lessons.flatMap(l=>l.vocabulary||[]).length;
  const el=document.getElementById('topbar-count');
  if(el) el.textContent=`${lessons.length} lesson${lessons.length!==1?'s':''} · ${tot} vocabulary items`;
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildDeck(){
  let pool=lessons.flatMap(l=>(l.vocabulary||[]).map(v=>({...v,_lt:l.lessonTitle,_lid:l.id})));
  if(pr.filterLesson!=='all') pool=pool.filter(v=>v._lid===pr.filterLesson);
  if(pr.filterType!=='all')   pool=pool.filter(v=>v.type===pr.filterType);
  if(pr.focusWeak){ const mastery=getMasteryMap(); const weighted=[]; pool.forEach(v=>{const score=mastery[masteryKey(v)]||0;const weight=Math.max(1,6-score);for(let i=0;i<weight;i++)weighted.push(v);}); const shuffled=shuffle(weighted); const seen=new Set(); const unique=[]; shuffled.forEach(v=>{const k=masteryKey(v);if(!seen.has(k)){seen.add(k);unique.push(v);}}); return pr.cardLimit>0?unique.slice(0,pr.cardLimit):unique; }
  const shuffled=shuffle(pool); return pr.cardLimit>0?shuffled.slice(0,pr.cardLimit):shuffled;
}

function startPractice(){ const deck=buildDeck(); if(!deck.length){alert('No vocabulary matches your filters.');return;} if(deck.length<2&&(pr.mode==='quiz'||pr.mode==='pinyin')){alert('Need at least 2 cards for this mode.');return;} pr.deck=deck;pr.idx=0;pr.flipped=false;pr.known=0;pr.unsure=0;pr.qCorrect=0;pr.qWrong=0;pr.chosen=null;pr.answered=false;pr.typeVal='';pr.typeRevealed=false;pr.sessionResults={};pr.aiExBusy=false;pr.aiExText=''; if(pr.mode==='quiz'||pr.mode==='pinyin')buildQuizOpts(); pr.screen='playing'; render(); }
function buildQuizOpts(){ if(!pr.deck.length||pr.idx>=pr.deck.length)return; const correct=pr.deck[pr.idx]; const allPool=lessons.flatMap(l=>(l.vocabulary||[]).map(v=>({...v,_lt:l.lessonTitle,_lid:l.id}))); const pool=allPool.filter(v=>v.chinese!==correct.chinese); const wrong=shuffle(pool).slice(0,3); pr.opts=shuffle([correct,...wrong]);pr.chosen=null;pr.answered=false; }
function fcFlip(){pr.flipped=!pr.flipped;render();}
function fcMark(knew){ const v=pr.deck[pr.idx]; updateMastery(v,knew); if(knew)pr.known++;else pr.unsure++; pr.idx++;pr.flipped=false;pr.aiExBusy=false;pr.aiExText=''; if(pr.idx>=pr.deck.length){pr.screen='results';render();return;} render(); }
function qzChoose(i){ if(pr.answered)return; pr.chosen=i;pr.answered=true; const correct=pr.opts[i].chinese===pr.deck[pr.idx].chinese; if(correct)pr.qCorrect++;else pr.qWrong++; updateMastery(pr.deck[pr.idx],correct);pr.aiExBusy=false;pr.aiExText=''; render(); }
function qzNext(){ pr.idx++;pr.aiExBusy=false;pr.aiExText=''; if(pr.idx>=pr.deck.length){pr.screen='results';render();return;} buildQuizOpts();render(); }
function typeSubmit(){ const inp=document.getElementById('type-inp');if(!inp)return; pr.typeVal=inp.value;pr.answered=true; const v=pr.deck[pr.idx]; const userAns=(pr.typeVal||'').trim().toLowerCase(); const correct=v.english.toLowerCase(); const keywords=correct.replace(/[/\-()]/g,' ').split(/\s+/).filter(w=>w.length>2); const isOk=keywords.some(kw=>userAns.includes(kw))||userAns===correct||correct.includes(userAns); if(isOk)pr.qCorrect++;else pr.qWrong++; updateMastery(v,isOk); render(); }
function typeReveal(){pr.typeRevealed=true;render();}
function typeNext(){ pr.idx++;pr.aiExBusy=false;pr.aiExText=''; if(pr.idx>=pr.deck.length){pr.screen='results';render();return;} pr.answered=false;pr.typeVal='';pr.typeRevealed=false; render(); setTimeout(()=>{const el=document.getElementById('type-inp');if(el)el.focus();},50); }

async function generateAIExample(v){ const apiKey=(ls.get('mn-apikey')||'').trim(); if(!apiKey){pr.aiExText='Add your API key in the Upload tab first.';render();return;} pr.aiExBusy=true;pr.aiExText='';render(); try{ const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:120,messages:[{role:'user',content:`Give ONE short, natural example sentence in Chinese using "${v.chinese}" (${v.english}). Reply in this exact format with no extra text:\nChinese: <sentence>\nEnglish: <translation>`}]})}); const data=await resp.json(); if(data.error)throw new Error(data.error.message); pr.aiExText=(data.content[0]?.text||'').trim();pr.aiExBusy=false;render(); }catch(err){pr.aiExBusy=false;pr.aiExText='Could not generate example.';render();} }
function renderAIExample(v){ if(!v.example&&!pr.aiExText&&!pr.aiExBusy){ return `<button class="ai-ex-btn" onclick="generateAIExample(pr.deck[pr.idx])">✨ Show example sentence</button>`; } if(pr.aiExBusy)return`<div class="ai-ex-loading">Generating example…</div>`; if(pr.aiExText)return`<div class="ai-ex-result">✨ ${pr.aiExText.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`; return ''; }

function renderTypeIn(){

async function analyseSentence(){ const ta=document.getElementById('sn-ta'); if(!ta)return; sn.text=ta.value.trim(); if(!sn.text){sn.msg='Please paste a Chinese sentence first.';sn.err=true;sn.ok=false;render();return;} const apiKey=(ls.get('mn-apikey')||'').trim(); if(!apiKey){sn.msg='Add your Anthropic API key in the Upload PDF tab first.';sn.err=true;sn.ok=false;render();return;} sn.busy=true;sn.msg='Analysing sentence…';sn.ok=false;sn.err=false;sn.preview=null;render(); try{ const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:[{type:'text',text:'Break down this Chinese text into vocabulary for a language learner. Extract every meaningful word, phrase, and idiom worth learning. Return ONLY valid JSON, no markdown:\n{"lessonTitle":"3-5 word title describing the topic","category":"Daily Life|Travel|Work & Business|Idioms & Expressions|Food|People & Relationships|Other","vocabulary":[{"chinese":"characters","pinyin":"pinyin with tones","english":"meaning","type":"word|phrase|sentence|idiom","example":"the original sentence if this word appears in it, else empty string"}]}\nText: '+sn.text}]}]})}); const data=await resp.json(); if(data.error)throw new Error(data.error.message||'API error'); const txt=data.content.map(i=>i.text||'').join(''); const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim()); sn.preview=parsed;sn.busy=false;sn.msg='';render(); }catch(err){sn.busy=false;sn.err=true;sn.ok=false;sn.msg='Error: '+err.message;render();} }
function snToggleWord(i){ if(!sn.preview)return; sn.preview.vocabulary[i]._selected=!sn.preview.vocabulary[i]._selected; render(); }
function snSelectAll(val){if(!sn.preview)return;sn.preview.vocabulary.forEach(v=>v._selected=val);render();}
function snSave(){ if(!sn.preview)return; const toSave=(sn.preview.vocabulary||[]).filter(v=>v._selected!==false); if(!toSave.length){alert('Select at least one word to save.');return;} const lid='lesson:'+Date.now(); const lesson={id:lid,fileName:'Sentence Analysis',lessonTitle:sn.preview.lessonTitle||'Sentence Vocabulary',category:sn.preview.category||'Other',vocabulary:toSave.map(v=>({chinese:v.chinese,pinyin:v.pinyin,english:v.english,type:v.type,example:v.example||''})),date:new Date().toISOString(),wordCount:toSave.length}; ls.set(lid,JSON.stringify(lesson)); loadLessons(); sn={text:'',busy:false,msg:'Saved '+toSave.length+' words to your notebook!',ok:true,err:false,preview:null}; render(); setTimeout(()=>gotoTab('review'),1800); }

function hskMastered(level){ try{return new Set(JSON.parse(localStorage.getItem(currentUser.id+'_hsk_mastered_'+level)||'[]'));}catch(e){return new Set();} }
function hskSaveMastered(level,set){ localStorage.setItem(currentUser.id+'_hsk_mastered_'+level,JSON.stringify([...set])); }
function hskToggleMastered(level,chinese){ const m=hskMastered(level); m.has(chinese)?m.delete(chinese):m.add(chinese); hskSaveMastered(level,m); render(); }
function hskResetLevel(level){ if(!confirm('Reset all mastered words for '+level.toUpperCase()+'?'))return; localStorage.removeItem(currentUser.id+'_hsk_mastered_'+level); render(); }

async function loadHSKWords(level){ hsk.loading=true;hsk.loadErr=false;hsk.words=[];render(); const isJames=currentUser.id==='james'; const file=isJames?(level+'.json'):'hsk_bubu.json'; try{ const r=await fetch(file); if(!r.ok)throw new Error('File not found: '+file); const data=await r.json(); if(!isJames&&data.levels){hsk.words=data.levels[level]||[];}else{hsk.words=data.words||data||[];} hsk.loading=false;render(); }catch(e){hsk.loading=false;hsk.loadErr=true;hsk.words=[];render();} }
function switchHSKLevel(level){ hsk.level=level;hsk.words=[];hsk.loading=false;hsk.loadErr=false;hsk.view='browse';hsk.filter='all';hsk.search='';hsk.exItems=[];hsk.exIdx=0;hsk.exOk=0;hsk.exWrong=0; loadHSKWords(level); }

async function generateHSKExercise(){ const apiKey=(ls.get('mn-apikey')||'').trim(); if(!apiKey){alert('Add your Anthropic API key in the Upload PDF tab first.');return;} const mastered=hskMastered(hsk.level); const pool=hsk.words.filter(w=>!mastered.has(w.c)).slice(0,80); if(pool.length<4){alert('Not enough unmastered words to generate exercises.');return;} const pick=shuffle(pool).slice(0,15); hsk.exBusy=true;hsk.exItems=[];hsk.exIdx=0;hsk.exOk=0;hsk.exWrong=0;render(); try{ const wordList=pick.map(w=>`${w.c}(${w.p}): ${w.e}`).join('\n'); const modePrompt=hsk.exMode==='fill'?'Create 8 fill-in-the-blank sentences in Chinese. Each sentence must use exactly one word from the list below in a natural context. Return ONLY valid JSON:\n{"exercises":[{"sentence":"Chinese sentence with ___ for the blank","answer":"the Chinese word that fills the blank","english_hint":"English translation of the sentence","options":["correct answer","wrong1","wrong2","wrong3"]}]}\nShuffle the options array.':'Create 6 scenario-based questions in Chinese that test understanding of the words below. Return ONLY valid JSON:\n{"exercises":[{"sentence":"Chinese sentence or question with ___ for the blank","answer":"correct Chinese word","english_hint":"English context/hint","options":["correct","wrong1","wrong2","wrong3"]}]}'; const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:modePrompt+'\n\nWord list:\n'+wordList}]})}); const data=await resp.json(); if(data.error)throw new Error(data.error.message); const txt=data.content.map(i=>i.text||'').join(''); const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim()); hsk.exItems=(parsed.exercises||[]).map(e=>({...e,feedback:'',chosen:null,answered:false})); hsk.exBusy=false;hsk.view='exercise';render(); }catch(err){hsk.exBusy=false;alert('Error: '+err.message);render();} }
function hskExChoose(i){ const item=hsk.exItems[hsk.exIdx]; if(!item||item.answered)return; item.chosen=i;item.answered=true; const ok=item.options[i]===item.answer; item.feedback=ok?'✓ Correct!':'✗ Not quite — the correct answer is: '+item.answer; if(ok)hsk.exOk++;else hsk.exWrong++; render(); }
function hskExNext(){ if(hsk.exIdx<hsk.exItems.length-1){hsk.exIdx++;render();}else{hsk.view='exercise_done';render();} }

async function doUpload(input){
  const file=input.files[0];if(!file)return;
  const apiKey=(ls.get('mn-apikey')||document.getElementById('akey')?.value||'').trim();
  if(!apiKey){upMsg='Please enter your Anthropic API key above.';upErr=true;upOk=false;render();return;}
  if(!file.name.toLowerCase().endsWith('.pdf')){upMsg='Please select a PDF file.';upErr=true;upOk=false;render();return;}
  busy=true;upOk=false;upErr=false;upMsg='Reading PDF file…';upPct=10;render();
  try{
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(new Error('Failed to read file'));r.readAsDataURL(file);});
    upMsg='Sending to Claude AI…';upPct=30;render();
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},{type:'text',text:'Extract ALL vocabulary from this Mandarin lesson PDF. Return ONLY valid JSON, no markdown fences:\n{"lessonTitle":"short topic 3-6 words","category":"Daily Life|Travel|Work & Business|Idioms & Expressions|Food|People & Relationships|Other","vocabulary":[{"chinese":"chars","pinyin":"tones","english":"meaning","type":"word|phrase|sentence|idiom","example":"example sentence from PDF if present, else empty string"}]}\nInclude every item: words, phrases, sentences, idioms, slang. Preserve Chinese exactly.'}]}]})});
    upMsg='Processing results…';upPct=75;render();
    const data=await resp.json();
    if(data.error)throw new Error(data.error.message||'API error');
    const txt=data.content.map(i=>i.text||'').join('');
    const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim());
    upMsg='Saving to notebook…';upPct=90;render();
    const lid='lesson:'+Date.now();
    const lesson={id:lid,fileName:file.name,lessonTitle:parsed.lessonTitle,category:parsed.category,vocabulary:parsed.vocabulary||[],date:new Date().toISOString(),wordCount:(parsed.vocabulary||[]).length};
    ls.set(lid,JSON.stringify(lesson)); loadLessons();
    busy=false;upOk=true;upErr=false;upPct=100;
    upMsg=`Done! Extracted ${lesson.wordCount} vocabulary items from "${lesson.lessonTitle}"`;
    render();setTimeout(()=>gotoTab('review'),2200);
  }catch(err){busy=false;upErr=true;upOk=false;upMsg='Error: '+err.message;render();}
  if(input)input.value='';
}

        qZh: '该岗位的核心绩效考核指标是什么？',
        qPin: 'Gāi gǎngwèi de héxīn jīxiào kǎohé zhǐbiāo shì shénme?',
        a: 'This shows you think about performance and accountability — important for a business-facing role.',
        aZh: '这表明你重视绩效和责任感——对面向客户的岗位很重要。',
        aPin: 'Zhè biǎomíng nǐ zhòngshì jīxiào hé zérèngǎn — duì miànxiàng kèhù de gǎngwèi hěn zhòngyào.',
        keywords: ['绩效考核','KPI','责任感'],
        keywordPins: ['jīxiào kǎohé','KPI','zérèngǎn']
      },
      {
        q: 'How does the company support employees- career development in Indonesia?',
        qZh: '公司在印尼为员工提供哪些职业发展支持？',
        qPin: 'Gōngsī zài Yìnní wèi yuángōng tígōng nǎxiē zhíyè fāzhǎn zhīchí?',
        a: 'Shows long-term commitment and interest in growing within the company.',
        aZh: '表明你的长期投入和在公司内成长的意愿。',
        aPin: 'Biǎomíng nǐ de chángqī tóurù hé zài gōngsī nèi chéngzhǎng de yìyuàn.',
        keywords: ['职业发展','员工支持','长期投入'],
        keywordPins: ['zhíyè fāzhǎn','yuángōng zhīchí','chángqī tóurù']
      }
    ]
  }
];

let iv = {
  mode: 'study',        // 'study' | 'flashcard' | 'quiz'
  section: 'all',
  cardIdx: 0,
  revealed: false,
  quizOpts: [],
  quizChosen: null,
  quizAnswered: false,
  quizCorrect: 0,
  quizTotal: 0,
  quizDeck: [],
  quizIdx: 0,
  quizScreen: 'setup',  // 'setup' | 'playing' | 'done'
  showZh: true,
};

function ivAllQA(){
  const sec = iv.section === 'all' ? INTERVIEW_DATA : INTERVIEW_DATA.filter(s=>s.section===iv.section);
  return sec.flatMap(s=>s.qa.map(q=>({...q, _section:s.section, _sectionEn:s.sectionEn, _color:s.color})));
}
function ivBuildQuizDeck(){ iv.quizDeck = shuffle(ivAllQA()); iv.quizIdx=0; iv.quizCorrect=0; iv.quizTotal=iv.quizDeck.length; iv.quizChosen=null; iv.quizAnswered=false; iv.quizOpts=[]; }
function ivBuildOpts(){
  const all = ivAllQA();
  const cur = iv.quizDeck[iv.quizIdx];
  const wrong = shuffle(all.filter(q=>q.q!==cur.q)).slice(0,3);
  iv.quizOpts = shuffle([cur, ...wrong]);
}
function ivStartQuiz(){ ivBuildQuizDeck(); ivBuildOpts(); iv.quizScreen='playing'; render(); }
function ivQuizChoose(i){
  if(iv.quizAnswered) return;
  iv.quizChosen=i; iv.quizAnswered=true;
  if(iv.quizOpts[i].q === iv.quizDeck[iv.quizIdx].q) iv.quizCorrect++;
  render();
}
function ivQuizNext(){
  iv.quizIdx++;
  if(iv.quizIdx>=iv.quizDeck.length){ iv.quizScreen='done'; render(); return; }
  iv.quizAnswered=false; iv.quizChosen=null;
  ivBuildOpts(); render();
}

function zhPin(zh, pin, col){
  // Renders Chinese text with pinyin underneath in a tidy block
  return `<div style="display:inline-block;text-align:center;vertical-align:top">
    <div style="font-family:var(--zh);font-size:.95rem;color:var(--text);line-height:1.5">${zh}</div>
    <div style="font-family:var(--mono);font-style:italic;font-size:.72rem;color:${col||'var(--gold)'};line-height:1.3;margin-top:1px">${pin}</div>
  </div>`;
}
function zhPinBlock(zh, pin, col, zhSize, pinSize){
  // Full-width block: Chinese paragraph + pinyin below it
  return `<div style="margin-bottom:.2rem">
    <div style="font-family:var(--zh);font-size:${zhSize||'.95rem'};color:var(--text);line-height:1.9">${zh}</div>
    <div style="font-family:var(--mono);font-style:italic;font-size:${pinSize||'.75rem'};color:${col||'var(--gold)'};line-height:1.6;margin-top:2px">${pin}</div>
  </div>`;
}

function renderInterview(){
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let h = '<div class="fu" style="max-width:860px;margin:0 auto">';

  // Header
  h += `<div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:1.5rem">
    <div>
      <div style="font-family:var(--serif);font-size:1.3rem;font-weight:500;margin-bottom:4px">🎤 面试准备</div>
      <div style="font-size:.85rem;color:var(--muted)">China Mobile Indonesia — Assistant Solution Manager</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn${iv.mode==='study'?' primary':''}" onclick="iv.mode='study';iv.cardIdx=0;render()">📖 Study</button>
      <button class="btn${iv.mode==='flashcard'?' primary':''}" onclick="iv.mode='flashcard';iv.cardIdx=0;iv.revealed=false;render()">🎴 Flashcards</button>
      <button class="btn${iv.mode==='quiz'?' primary':''}" onclick="iv.mode='quiz';iv.quizScreen='setup';render()">🧠 Quiz</button>
    </div>
  </div>`;

  // Section filter
  h += `<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center"><span style="font-size:.75rem;color:var(--faint);text-transform:uppercase;letter-spacing:.07em">Section:</span>`;
  h += `<button class="hsk-lvl${iv.section==='all'?' active':''}" onclick="iv.section='all';iv.cardIdx=0;iv.revealed=false;render()">All</button>`;
  INTERVIEW_DATA.forEach(s=>{
    h += `<button class="hsk-lvl${iv.section===s.section?' active':''}" onclick="iv.section='${esc(s.section)}';iv.cardIdx=0;iv.revealed=false;render()" style="${iv.section===s.section?'':'border-color:'+s.color+'44;color:'+s.color+';'}">${esc(s.sectionEn)}</button>`;
  });
  h += `</div>`;

  // ── STUDY MODE ──
  if(iv.mode==='study'){
    const sections = iv.section==='all' ? INTERVIEW_DATA : INTERVIEW_DATA.filter(s=>s.section===iv.section);
    let qNum=0;
    sections.forEach(sec=>{
      h += `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:1.25rem">
        <div style="background:${sec.color}18;border-bottom:1px solid ${sec.color}33;padding:.85rem 1.25rem;display:flex;align-items:center;gap:10px">
          <div style="width:4px;height:24px;background:${sec.color};border-radius:2px;flex-shrink:0"></div>
          <div>
            <div style="font-family:var(--serif);font-size:.95rem;font-weight:500">${esc(sec.sectionEn)}</div>
            <div style="font-size:.72rem;color:var(--faint)">${esc(sec.section)} · ${sec.qa.length} questions</div>
          </div>
        </div>`;
      sec.qa.forEach((item,qi)=>{
        qNum++;
        h += `<div style="padding:1.1rem 1.25rem;border-bottom:1px solid var(--border)">
          <div style="display:flex;gap:10px;margin-bottom:.85rem">
            <div style="width:22px;height:22px;border-radius:50%;background:${sec.color}22;color:${sec.color};font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px">Q${qNum}</div>
            <div style="flex:1">
              <div style="font-size:.92rem;font-weight:500;color:var(--text);margin-bottom:6px">${esc(item.q)}</div>
              <div style="background:${sec.color}08;border-radius:var(--r-sm);padding:.5rem .75rem">
                ${zhPinBlock(esc(item.qZh), esc(item.qPin), sec.color+'cc', '.9rem', '.72rem')}
              </div>
            </div>
          </div>
          <div style="margin-left:32px">
            <div style="background:${sec.color}0d;border-left:3px solid ${sec.color}55;border-radius:0 var(--r-sm) var(--r-sm) 0;padding:.75rem 1rem;margin-bottom:.6rem">
              <div style="font-size:.72rem;color:${sec.color};text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem">English Answer</div>
              <div style="font-size:.9rem;color:var(--text);line-height:1.7">${esc(item.a)}</div>
            </div>
            <div style="background:var(--card2);border-left:3px solid ${sec.color}33;border-radius:0 var(--r-sm) var(--r-sm) 0;padding:.75rem 1rem;margin-bottom:.7rem">
              <div style="font-size:.72rem;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem">中文答案 + Pīnyīn</div>
              ${zhPinBlock(esc(item.aZh), esc(item.aPin), 'var(--gold)', '.95rem', '.76rem')}
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start">
              <span style="font-size:.68rem;color:var(--faint);margin-right:3px;padding-top:6px">Key words:</span>
              ${item.keywords.map((kw,ki)=>`<div style="text-align:center">
                <div style="font-family:var(--zh);font-size:.8rem;background:${sec.color}15;color:${sec.color};padding:3px 9px 1px;border-radius:4px 4px 0 0;border:1px solid ${sec.color}30;border-bottom:none">${esc(kw)}</div>
                <div style="font-family:var(--mono);font-style:italic;font-size:.65rem;color:${sec.color}99;background:${sec.color}08;padding:1px 9px 3px;border-radius:0 0 4px 4px;border:1px solid ${sec.color}20;border-top:none">${esc(item.keywordPins[ki]||'')}</div>
              </div>`).join('')}
            </div>
          </div>
        </div>`;
      });
      h += `</div>`;
    });
  }

  // ── FLASHCARD MODE ──
  else if(iv.mode==='flashcard'){
    const deck = ivAllQA();
    if(!deck.length){ h+=`<div class="empty"><div class="empty-ttl">No questions in this section</div></div>`; }
    else {
      const cur = deck[iv.cardIdx % deck.length];
      const total=deck.length, idx=iv.cardIdx%total;

      h+=`<div class="prac-prog-wrap" style="margin-bottom:1.25rem"><div class="prac-prog-bar"><div class="prac-prog-fill" style="width:${(idx/total*100)}%"></div></div><span style="font-size:.82rem;color:var(--muted)">${idx+1} / ${total}</span></div>`;

      if(!iv.revealed){
        h+=`<div class="fc-card" onclick="iv.revealed=true;render()" style="min-height:240px;border-color:${cur._color}44">
          <div class="fc-face-label" style="color:${cur._color}99">Tap to reveal answer · ${esc(cur._sectionEn)}</div>
          <div style="font-size:.72rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.85rem">English question:</div>
          <div style="font-size:1.05rem;font-weight:500;color:var(--text);line-height:1.65;max-width:520px;text-align:center;margin-bottom:.75rem">${esc(cur.q)}</div>
          <div style="background:${cur._color}0a;border-radius:var(--r-md);padding:.6rem 1rem;text-align:center;max-width:560px">
            <div style="font-family:var(--zh);font-size:.88rem;color:var(--muted);line-height:1.7">${esc(cur.qZh)}</div>
            <div style="font-family:var(--mono);font-style:italic;font-size:.72rem;color:${cur._color}aa;margin-top:3px;line-height:1.5">${esc(cur.qPin)}</div>
          </div>
          <div class="fc-tap-hint">tap to reveal</div>
        </div>`;
      } else {
        h+=`<div class="fc-card revealed" onclick="iv.revealed=false;render()" style="min-height:340px;border-color:${cur._color}88">
          <div class="fc-face-label" style="color:${cur._color}">Answer · tap to flip back</div>
          <div style="font-size:.85rem;font-weight:500;color:var(--muted);margin-bottom:1rem;text-align:center;max-width:500px">${esc(cur.q)}</div>
          <div style="background:${cur._color}10;border-radius:var(--r-md);padding:1rem 1.25rem;margin-bottom:.85rem;max-width:580px;text-align:left;width:100%">
            <div style="font-size:.7rem;color:${cur._color};text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem">English</div>
            <div style="font-size:.9rem;color:var(--text);line-height:1.7">${esc(cur.a)}</div>
          </div>
          <div style="background:var(--card2);border-radius:var(--r-md);padding:1rem 1.25rem;margin-bottom:.85rem;max-width:580px;text-align:left;width:100%">
            <div style="font-size:.7rem;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem">中文 + Pīnyīn</div>
            ${zhPinBlock(esc(cur.aZh), esc(cur.aPin), 'var(--gold)', '1rem', '.76rem')}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:580px">
            ${cur.keywords.map((kw,ki)=>`<div style="text-align:center">
              <div style="font-family:var(--zh);font-size:.78rem;background:${cur._color}15;color:${cur._color};padding:2px 8px 1px;border-radius:4px 4px 0 0;border:1px solid ${cur._color}30;border-bottom:none">${esc(kw)}</div>
              <div style="font-family:var(--mono);font-style:italic;font-size:.63rem;color:${cur._color}99;background:${cur._color}08;padding:1px 8px 2px;border-radius:0 0 4px 4px;border:1px solid ${cur._color}20;border-top:none">${esc(cur.keywordPins[ki]||'')}</div>
            </div>`).join('')}
          </div>
        </div>`;
      }
      h+=`<div class="fc-actions" style="justify-content:center;gap:12px">
        <button class="fc-btn-nav" onclick="iv.cardIdx=Math.max(0,(iv.cardIdx||0)-1);iv.revealed=false;render()" ${idx===0?'disabled':''}>← Prev</button>
        <button class="btn primary" onclick="iv.cardIdx=(iv.cardIdx||0)+1;iv.revealed=false;render()" style="padding:12px 32px">${idx+1<total?'Next →':'Restart 🔄'}</button>
        <button class="fc-btn-nav" onclick="iv.cardIdx=(iv.cardIdx||0)+1;iv.revealed=false;render()">Skip →</button>
      </div>`;
      h+=`<div style="display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:1rem">`;
      deck.forEach((_,i)=>{ const w=Math.max(6,Math.min(20,Math.floor(560/deck.length)-4)); const col=i<idx?'#2d9e6b':i===idx?'var(--red)':'var(--border2)'; h+=`<div style="width:${w}px;height:4px;border-radius:2px;background:${col};transition:background .3s"></div>`; });
      h+=`</div>`;
    }
  }

  // ── QUIZ MODE ──
  else if(iv.mode==='quiz'){
    if(iv.quizScreen==='setup'){
      h+=`<div class="prac-setup" style="max-width:580px;margin:0 auto">
        <div style="font-family:var(--serif);font-size:1.1rem;font-weight:500;margin-bottom:6px">Interview Quiz</div>
        <p style="font-size:.88rem;color:var(--muted);margin-bottom:1.5rem">Read the English question, then pick the correct Chinese answer (with pinyin!) from the choices below.</p>
        <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.25rem;margin-bottom:1.25rem">
          <div style="font-size:.75rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.85rem">Quiz covers</div>
          ${INTERVIEW_DATA.map(s=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:.6rem"><div style="width:10px;height:10px;border-radius:50%;background:${s.color};flex-shrink:0"></div><span style="font-size:.85rem;color:var(--text)">${esc(s.sectionEn)}</span><span style="font-size:.75rem;color:var(--faint)">${s.qa.length} Qs</span></div>`).join('')}
        </div>
        <div style="font-size:.82rem;color:var(--muted);background:var(--card2);border-radius:var(--r-md);padding:.75rem 1rem;margin-bottom:1.25rem">💡 Tip: Each answer option shows Chinese characters <em>and</em> pinyin so you can practise reading both!</div>
        <button class="btn primary" style="width:100%;padding:15px;font-size:1rem;justify-content:center;border-radius:var(--r-md)" onclick="ivStartQuiz()">Start Quiz (${ivAllQA().length} questions) →</button>
      </div>`;
    }
    else if(iv.quizScreen==='playing'){
      const cur = iv.quizDeck[iv.quizIdx];
      const total=iv.quizDeck.length, done=iv.quizIdx;
      h+=`<div style="max-width:680px;margin:0 auto">`;
      h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <span style="font-size:.85rem;color:var(--muted)">Question ${done+1} of ${total}</span>
        <button class="fc-btn-nav" onclick="iv.quizScreen='setup';render()">← Setup</button>
      </div>`;
      h+=`<div class="prac-prog-wrap"><div class="prac-prog-bar"><div class="prac-prog-fill" style="width:${Math.round(done/total*100)}%"></div></div><span style="font-size:.82rem;color:#4dd892">✓ ${iv.quizCorrect}</span><span style="font-size:.82rem;color:#f08080">✗ ${done-iv.quizCorrect}</span></div>`;
      // Question card — show English question + Chinese question with pinyin
      h+=`<div class="qz-q-card" style="margin-bottom:1rem;border-color:${cur._color}44">
        <div class="qz-q-label" style="color:${cur._color}">${esc(cur._sectionEn)} · Pick the correct Chinese answer</div>
        <div style="font-size:1.05rem;font-weight:500;color:var(--text);line-height:1.65;margin-bottom:.75rem">${esc(cur.q)}</div>
        <div style="background:${cur._color}0a;border-radius:var(--r-md);padding:.6rem 1rem;display:inline-block;text-align:left">
          <div style="font-family:var(--zh);font-size:.88rem;color:var(--muted);line-height:1.7">${esc(cur.qZh)}</div>
          <div style="font-family:var(--mono);font-style:italic;font-size:.72rem;color:${cur._color}aa;margin-top:2px;line-height:1.5">${esc(cur.qPin)}</div>
        </div>
      </div>`;
      // Options — Chinese answer + pinyin stacked
      h+=`<div class="qz-opts" style="grid-template-columns:1fr">`;
      iv.quizOpts.forEach((opt,i)=>{
        const isCorrect=opt.q===cur.q;
        let cls='qz-opt';
        if(iv.quizAnswered){ if(i===iv.quizChosen&&isCorrect)cls+=' correct'; else if(i===iv.quizChosen&&!isCorrect)cls+=' wrong'; else if(isCorrect)cls+=' reveal'; }
        h+=`<button class="${cls}" ${iv.quizAnswered?'disabled':''} onclick="ivQuizChoose(${i})" style="text-align:left;padding:12px 16px">
          <div style="font-family:var(--zh);font-size:.95rem;line-height:1.7;margin-bottom:3px">${esc(opt.aZh)}</div>
          <div style="font-family:var(--mono);font-style:italic;font-size:.72rem;opacity:.7;line-height:1.4">${esc(opt.aPin)}</div>
        </button>`;
      });
      h+=`</div>`;
      if(iv.quizAnswered){
        const ok=iv.quizOpts[iv.quizChosen].q===cur.q;
        h+=`<div class="qz-feedback ${ok?'ok':'bad'}" style="margin-top:.75rem">${ok?'✓ Correct! 做得好！':'✗ Not quite — the correct answer is highlighted in green'}</div>`;
        if(!ok) h+=`<div style="background:${cur._color}0e;border-radius:var(--r-md);padding:.85rem 1rem;margin-bottom:.75rem"><div style="font-size:.72rem;color:${cur._color};text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem">Correct English Answer</div><div style="font-size:.88rem;color:var(--text);line-height:1.65">${esc(cur.a)}</div></div>`;
        h+=`<button class="qz-next" onclick="ivQuizNext()" style="margin-top:.5rem">${iv.quizIdx+1>=total?'See results →':'Next question →'}</button>`;
      }
      h+=`</div>`;
    }
    else if(iv.quizScreen==='done'){
      const total=iv.quizDeck.length, correct=iv.quizCorrect, pct=Math.round(correct/total*100);
      const color=pct>=80?'#2d9e6b':pct>=60?'#c4933a':'#c93a2b';
      const msg=pct>=80?'面试准备很到位！🎉':pct>=60?'不错！继续加油！💪':'继续练习！加油！📚';
      h+=`<div class="prac-results" style="max-width:480px;margin:0 auto;text-align:center">
        <div class="prac-score-circle" style="border-color:${color}"><div class="prac-score-num" style="color:${color}">${pct}%</div><div class="prac-score-lbl" style="color:${color}">Score</div></div>
        <div style="font-family:var(--serif);font-size:1.2rem;margin-bottom:.4rem">${msg}</div>
        <div style="font-size:.88rem;color:var(--muted);margin-bottom:1.5rem">${correct} / ${total} correct</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <button class="btn primary" onclick="ivStartQuiz()">Practice again</button>
          <button class="btn" onclick="iv.mode='study';render()">Back to study</button>
          <button class="btn" onclick="iv.quizScreen='setup';render()">Change settings</button>
        </div>
      </div>`;
    }
  }

  h+='</div>';
  return h;
}

showProfiles();
</script>
</body>
</html>
